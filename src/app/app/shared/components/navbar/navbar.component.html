<nav class="navbar">
  <div class="nav-container">

    <!-- Logo here-->
    <a class="logo" routerLink="/" (click)="closeMenu()">
      <img src="assets/images/logo1.png" alt="Logo">
    </a>

    <!-- Hamburger here -->
    <button class="hamburger" (click)="toggleMenu()" [class.active]="menuOpen" aria-label="Toggle navigation">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Overlay -->
    <div class="overlay" *ngIf="menuOpen" (click)="closeMenu()"></div>

    <!-- Nav Links -->
    <div class="nav-menu" [class.open]="menuOpen">

     <ul class="nav-links">
  <li *ngFor="let link of navLinks">
    <!-- Internal route -->
    <a *ngIf="link.path" [routerLink]="link.path" (click)="closeMenu()">
      {{ link.label }}
    </a>

    <!-- External URL -->
    <a *ngIf="link.href" [href]="link.href" target="_blank" rel="noopener noreferrer" (click)="closeMenu()">
      {{ link.label }}
    </a>
  </li>
</ul>

      <!-- Auth Section -->
      <div class="auth-section" *ngIf="!isLoggedIn; else profileBlock">
        <a routerLink="/register" class="btn" (click)="closeMenu()">Sign Up</a>
        <a routerLink="/login" class="btn outline" (click)="closeMenu()">Login</a>
      </div>

      <ng-template #profileBlock>
        <div class="profile-section d-flex flex-wrap align-items-center gap-2">
          <a routerLink="/profile" class="btn outline" (click)="closeMenu()">Profile</a>
          <a routerLink="/performance" class="btn outline" (click)="closeMenu()">Performance</a>
          <button class="btn logout" (click)="logout()">Logout</button>
        </div>
      </ng-template>

    </div>
  </div>
</nav>
