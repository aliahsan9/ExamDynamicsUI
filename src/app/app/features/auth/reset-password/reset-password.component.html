<div class="auth-shell">
  <div class="card shadow-sm p-4 auth-card">
    <h2 class="fw-bold mb-2">Reset password</h2>
    <p class="text-muted small mb-4">Choose a new password for your account.</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!success">
      <div class="mb-3">
        <label class="form-label">New password</label>
        <input type="password" class="form-control" formControlName="newPassword" autocomplete="new-password" />
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm password</label>
        <input type="password" class="form-control" formControlName="confirm" autocomplete="new-password" />
      </div>
      <div *ngIf="errorMessage" class="alert alert-danger py-2">{{ errorMessage }}</div>
      <button
        type="submit"
        class="btn btn-primary w-100"
        [disabled]="loading || form.invalid || !email || !token"
      >
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        Update password
      </button>
    </form>

    <div *ngIf="success" class="alert alert-success">
      Password updated. Redirecting to login…
    </div>

    <p class="text-center mt-3 mb-0 small">
      <a routerLink="/login" class="text-decoration-none">Back to login</a>
    </p>
  </div>
</div>
