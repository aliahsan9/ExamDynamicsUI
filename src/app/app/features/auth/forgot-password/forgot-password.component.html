<div class="auth-shell">
  <div class="card shadow-sm p-4 auth-card">
    <h2 class="fw-bold mb-2">Forgot password</h2>
    <p class="text-muted small mb-4">
      Enter your email and we will send a reset link if an account exists.
    </p>

    <form *ngIf="!submitted" [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" formControlName="email" placeholder="you@example.com" />
      </div>
      <div *ngIf="errorMessage" class="alert alert-danger py-2">{{ errorMessage }}</div>
      <button type="submit" class="btn btn-primary w-100" [disabled]="loading || form.invalid">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        Send reset link
      </button>
    </form>

    <div *ngIf="submitted" class="alert alert-success">
      If an account exists for that email, you will receive reset instructions shortly.
    </div>

    <p class="text-center mt-3 mb-0 small">
      <a routerLink="/login" class="text-decoration-none">Back to login</a>
    </p>
  </div>
</div>
