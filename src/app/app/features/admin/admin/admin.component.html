<div class="admin-dashboard container py-5" data-aos="fade-up" data-aos-duration="400">
  <h2 class="text-center mb-5">
    <i class="bi bi-speedometer2 me-2"></i> Admin Dashboard
  </h2>

  <div class="row g-4">
    <!-- Cards Array -->
    <ng-container *ngFor="let card of adminCards">
      <div class="col-md-6 col-lg-3" data-aos="fade-up" data-aos-duration="400">
        <div class="admin-card card shadow-sm text-center p-4">
          <i [class]="card.icon + ' admin-icon'"></i>
          <h5 class="mt-3">{{ card.title }}</h5>
          <p class="text-muted small">{{ card.desc }}</p>
          <a [routerLink]="card.link" class="btn btn-primary btn-sm mt-2">
            Go <i class="bi bi-arrow-right"></i>
          </a>
        </div>
      </div>
    </ng-container>
  </div>
</div>
