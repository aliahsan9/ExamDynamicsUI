<section class="notes-section">
  <div class="notes-bg-mesh"></div>

  <div class="container">

    <!-- Header -->
    <div class="notes-header" data-aos="fade-down">
      <div class="header-tag">Study Resources</div>
      <h2 class="notes-title">
        Exam <span class="title-accent">Notes</span>
      </h2>
      <p class="notes-subtitle">
        Professionally curated, exam-focused notes to supercharge your preparation.
      </p>
    </div>

    <!-- Cards Grid -->
    <div class="notes-grid">
      <div
        class="note-card"
        *ngFor="let exam of exams; let i = index"
        [style.--delay]="i * 80 + 'ms'"
        data-aos="fade-up"
        [attr.data-aos-delay]="i * 80"
      >
        <div class="card-glow"></div>
        <div class="card-inner">
          <div class="card-top">
            <div class="icon-wrap">
              <i [class]="exam.icon"></i>
            </div>
            <div class="exam-badge">{{ exam.badge }}</div>
          </div>
          <h5 class="card-title">{{ exam.title }}</h5>
          <p class="card-desc">{{ exam.description }}</p>
          <a [href]="exam.link" class="card-btn">
            <span>Get Notes</span>
            <svg class="btn-arrow" viewBox="0 0 24 24" fill="none">
              <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
        </div>
      </div>
    </div>

  </div>
</section>
