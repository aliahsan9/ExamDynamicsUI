<div class="subscription-hero d-flex align-items-center justify-content-center">

  <div class="subscription-card p-4 shadow-sm">

    <div class="text-center mb-3">
      <h2 class="fw-bold text-primary">Subscribe to Our Newsletter</h2>
      <p class="text-muted small">
        Stay updated with the latest blogs, exam tips, and exclusive offers.
      </p>
    </div>

    <form [formGroup]="subscriptionForm" (ngSubmit)="onSubmit()" novalidate>

      <!-- Email Input -->
      <div class="form-floating mb-3 position-relative">
        <input
          type="email"
          class="form-control"
          id="email"
          placeholder="Your Email"
          formControlName="email"
          [class.is-invalid]="subscriptionForm.get('email')?.invalid && subscriptionForm.get('email')?.touched"
        />
        <label for="email">Your Email</label>
        <i class="bi bi-envelope-fill input-icon"></i>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="btn btn-primary w-100 fw-bold"
        [disabled]="subscriptionForm.invalid || isSubmitting"
      >
        <span *ngIf="!isSubmitting">
          <i class="bi bi-send-fill me-2"></i>Subscribe
        </span>
        <span *ngIf="isSubmitting">
          <i class="bi bi-arrow-repeat me-2 spinner-border spinner-border-sm"></i>Subscribing...
        </span>
      </button>

    </form>

    <!-- Feedback -->
    <div *ngIf="successMessage" class="alert alert-success mt-3 d-flex align-items-center">
      <i class="bi bi-check-circle-fill me-2"></i>{{ successMessage }}
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger mt-3 d-flex align-items-center">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ errorMessage }}
    </div>

    <div class="text-center mt-3 small text-muted">
      <i class="bi bi-shield-check me-1"></i>We respect your privacy. Unsubscribe anytime.
    </div>

  </div>
</div>
