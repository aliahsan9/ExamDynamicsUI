<div class="blog-hero d-flex align-items-center" *ngIf="!loading && blog">
  <div class="container my-5 position-relative">

    <!-- Blog Card -->
    <div class="card blog-single border-0" data-aos="fade-up">
      <img *ngIf="blog.thumbnailUrl"
           [src]="blog.thumbnailUrl"
           class="card-img-top blog-thumbnail"
           alt="Blog Thumbnail" />

      <div class="card-body p-4">
        <h2 class="blog-title">{{ blog.title }}</h2>

        <p class="text-muted small mb-3">
          <i class="bi bi-calendar3"></i>
          Published: {{ blog.publishedAt | date:'longDate' }}
        </p>

        <!-- Blog Content -->
        <div class="blog-content" [innerHTML]="blog.content"></div>
      </div>
    </div>

    <!-- Quote -->
    <div class="quote-box text-center mt-5 p-4 rounded" data-aos="fade-up">
      <blockquote class="blockquote mb-0">
        <p class="fst-italic">
          "Success is not final, failure is not fatal: it is the courage to continue that counts."
        </p>
        <footer class="blockquote-footer mt-2">
          Winston Churchill
        </footer>
      </blockquote>
    </div>

    <!-- CTA -->
    <div class="cta-box text-center mt-5 p-5 rounded" data-aos="zoom-in">
      <h3 class="fw-bold text-gradient">
        🎯 Start Your Success Journey Today!
      </h3>
      <p class="lead mb-3">
        Join thousands of students preparing with
        <span class="fw-bold">ExamDynamics</span>.
      </p>
      <a routerLink="/exams"
         class="btn btn-gradient btn-lg rounded-pill">
        Explore Exams <i class="bi bi-arrow-right-circle"></i>
      </a>
    </div>

  </div>
</div>
