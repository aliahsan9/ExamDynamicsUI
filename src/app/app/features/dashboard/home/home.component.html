<section class="hero-section d-flex align-items-center" id="top">
  <div class="container position-relative">
    <div class="row align-items-center gy-4">

      <!-- Left Content -->
      <div class="col-lg-6 hero-content text-lg-start text-center" data-aos="fade-right">
        <h1 class="hero-title">
          Ace Your Exams with <span>ExamDynamics</span>
        </h1>
        <p class="hero-subtitle">
          <i class="bi bi-patch-check-fill text-primary me-1"></i> 5 Million Questions |
          <i class="bi bi-journal-richtext text-success me-1"></i> 100+ Exams |
          <i class="bi bi-robot text-warning me-1"></i> AI Tutor Assistance <br />
          MCQs with solutions, hints & video explanations — everything you need in one place.
        </p>

        <a routerLink="/exams" class="btn hero-btn btn-lg">
          <i class="bi bi-play-circle-fill me-2"></i> Start Practicing Free
        </a>

        <!-- Hero Rating -->
        <div class="hero-rating mt-3">
          <div class="stars">
            <span *ngFor="let star of heroStars; let i = index" [class.filled]="i < 4.8">&#9733;</span>
          </div>
          <span class="rating-text">(Trusted by students worldwide)</span>
        </div>

        <!-- Stats Row -->
        <div class="hero-stats mt-4 d-flex flex-wrap justify-content-center gap-3">
          <div class="stat-card" *ngFor="let stat of heroStats" [attr.data-aos-delay]="stat.delay">
            <i class="bi fs-3 mb-2" [ngClass]="stat.icon"></i>
            <h5>{{ stat.value }}</h5>
            <p>{{ stat.label }}</p>
          </div>
        </div>
      </div>

      <!-- Right Image -->
      <div class="col-lg-6 text-center" data-aos="fade-left">
        <img src="assets/images/hero-section_img.webp" alt="Students" class="hero-img img-fluid" />
      </div>

    </div>

    <!-- Floating Shapes -->
    <div *ngFor="let shape of shapes"
         class="hero-shape"
         [ngClass]="shape.class"
         [ngStyle]="{
           width: shape.width + 'px',
           height: shape.height + 'px',
           backgroundColor: shape.color,
           top: shape.top,
           left: shape.left,
           bottom: shape.bottom,
           right: shape.right,
           animationDelay: shape.delay + 's'
         }">
    </div>
  </div>
</section>

<!-- Other Sections -->
<app-exam-detail></app-exam-detail>
<app-about></app-about>
<app-all-blogs></app-all-blogs>
<app-subscription-list></app-subscription-list>
<app-contact></app-contact>
